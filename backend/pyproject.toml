[project]
name = "finsight-backend"
version = "0.1.0"
description = "FinSight: multi-agent financial research copilot (API + RAG pipeline)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "sentence-transformers>=3.0",
    "torch>=2.4",
    "openai>=1.0",
    "mcp>=1.10",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.3.6",
    "yfinance>=1.7.0",
    "sse-starlette>=3.4.11",
    "redis>=8.1.0",
    "langfuse>=4.15.6",
]

# CPU-only torch: ~1GB smaller than the default CUDA wheels on Linux (Docker/CI).
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs a running Postgres with pgvector (skipped if unreachable)"]
